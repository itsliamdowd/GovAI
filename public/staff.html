<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Staff Desk</title>
<meta name="description" content="City of Santa Monica staff view of submitted applications: department queue, applicant search, status and notes.">
<link rel="icon" href="/icon.svg">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Same tokens, header, type scale and controls as index.html (resident view) */
  :root { --bg:#0b0e13; --ink:#e8eaed; --muted:#9aa0a6; --line:#2a2f37; --pill:#1b1f26; --pill-2:#232830; --blue:#2b6fe6; --blue-2:#3b82f6; --link:#7cb0ff;
    --ok:#86efac; --ok-bg:#0f2a1c; --warn:#fcd34d; --warn-bg:#2a1f0a; --err:#fca5a5; --err-bg:#2a1111; --info:#93c5fd; --info-bg:#0f1f3a; --sat:env(safe-area-inset-top) }
  * { box-sizing:border-box } html { -webkit-text-size-adjust:100% }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; min-height:100dvh; -webkit-font-smoothing:antialiased }
  button { font-family:inherit }
  header { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); padding:calc(10px + var(--sat)) 20px 10px }
  .hrow { max-width:720px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px }
  .brand { display:flex; align-items:center; gap:9px; text-decoration:none; color:var(--ink) }
  .brand .mark { width:24px; height:24px; flex:none; color:var(--ink) } .brand .mark * { fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round } .brand .mark .spark { fill:#fbbf24; stroke:none }
  .brand b { font:600 17px/1 Georgia,"Times New Roman",serif; letter-spacing:-.01em } .brand small { color:var(--muted); font-size:12px; margin-left:4px; padding-left:10px; border-left:1px solid var(--line) }
  .who { display:flex; align-items:center; gap:10px; font-size:13px; text-align:right } .who[hidden],[hidden] { display:none } .who b { font-weight:600 } .who span { color:var(--muted) }
  .menu,button.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); border-radius:999px; height:34px; padding:0 14px; font:inherit; font-size:13px; font-weight:500; cursor:pointer; transition:background .12s } .menu:hover,button.ghost:hover { background:var(--pill) }
  main { max-width:720px; margin:0 auto; padding:32px 20px 60px }
  h2 { margin:0 0 6px; font-size:15px; font-weight:600 } .sub { margin:0 0 14px; color:var(--muted); font-size:12.5px; line-height:1.45 }
  .box { border:1px solid var(--line); background:var(--pill); border-radius:14px; padding:16px 18px; max-width:480px; animation:pop .18s ease-out } @keyframes pop { from { opacity:0; transform:translateY(4px) } }
  /* sign-in card: full column width, roomier type and controls */
  #login { max-width:none; padding:32px 36px; margin-top:24px } #login h2 { font-size:24px; margin-bottom:8px } #login .sub { font-size:15px; margin-bottom:22px }
  #login label { font-size:16px; margin:18px 0 8px } #login :is(input,select) { font-size:17px; padding:14px 16px; border-radius:12px } #login button.primary { height:44px; padding:0 24px; font-size:15px; margin-top:22px !important }
  @media (max-width:640px) { #login { padding:22px 18px } }
  label { display:block; font-size:15px; font-weight:500; margin:12px 0 6px } input,select,textarea { width:100%; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font:inherit; font-size:15px; line-height:1.4; outline:none; box-sizing:border-box } :is(input,select,textarea):focus { border-color:var(--blue-2); box-shadow:none } textarea { min-height:84px; resize:vertical }
  /* native <select> ignores padding/height in Safari and paints its own stepper: draw it ourselves so it matches the text inputs */
  select { appearance:none; -webkit-appearance:none; padding-right:40px; height:46px; cursor:pointer; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%239aa0a6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>"); background-repeat:no-repeat; background-position:right 14px center } select option { background:var(--pill); color:var(--ink) }
  button.primary { background:var(--blue); color:#fff; border:1px solid var(--blue); border-radius:999px; height:34px; padding:0 16px; font:inherit; font-size:13px; font-weight:500; cursor:pointer } button.primary:hover { background:var(--blue-2) }
  .error { color:var(--err); font-size:14px; margin-top:8px; min-height:1em }
  .bar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px } .bar input { flex:1 1 240px } .bar select { flex:0 1 230px; width:auto }
  .app { border:1px solid var(--line); border-radius:14px; padding:12px 16px; margin:0 0 10px; cursor:pointer; transition:background .12s, border-color .12s } .app:hover { background:var(--pill); border-color:#3a414b } .app.open { background:var(--pill) }
  .app .top { display:flex; gap:10px; align-items:center; flex-wrap:wrap } .app .id { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-weight:600 } .app .name { font-weight:600 } .app .meta { color:var(--muted); font-size:13px; flex:1 1 100% }
  .st { font-size:11px; text-transform:uppercase; letter-spacing:.04em; padding:2px 9px; border-radius:999px; margin-left:auto; white-space:nowrap }
  .st.received { color:var(--info); background:var(--info-bg) } .st.in_review,.st.needs_info { color:var(--warn); background:var(--warn-bg) } .st.approved { color:var(--ok); background:var(--ok-bg) } .st.denied { color:var(--err); background:var(--err-bg) }
  .detail { display:none; margin-top:12px; border-top:1px solid var(--line); padding-top:12px; cursor:default } .app.open .detail { display:block }
  .detail dl { display:grid; grid-template-columns:140px 1fr; gap:4px 12px; margin:0 0 10px; font-size:14px } .detail dt { color:var(--muted) } .detail dd { margin:0; white-space:pre-wrap; word-break:break-word }
  .acts { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px } .acts button[data-s="approved"] { border-color:var(--ok); color:var(--ok) } .acts button[data-s="denied"] { border-color:var(--err); color:var(--err) }
  .empty { color:var(--muted); padding:30px 0; text-align:center }
  @media (max-width:640px) { header { padding-left:16px; padding-right:16px } .brand small { display:none } main { padding-top:20px } .box { max-width:100% } .who span { display:none } }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <a class="brand" href="/staff.html"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10l8.5-5 8.5 5"/><path d="M6 11.5v7M10 11.5v7M14 11.5v7M18 11.5v7"/><path d="M4 20.5h16"/><path class="spark" d="M19.5 1.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"/></svg><b>GovAI</b></a>
    <div class="who" id="who" hidden><div id="whoDept"></div><button type="button" class="menu" id="signout">Sign out</button></div>
  </div>
</header>
<main>
  <section class="box" id="login">
    <h2>Sign in</h2>
    <p class="sub">Pick your department and enter the staff code. This desk has no access to the resident assistant.</p>
    <label for="dept">Department</label><select id="dept"></select>
    <label for="name">Your name</label><input id="name" placeholder="Shown on the notes you leave" autocomplete="name">
    <label for="code">Staff code</label><input id="code" type="password" autocomplete="current-password">
    <div class="error" id="loginErr"></div>
    <button class="primary" id="signin" type="button" style="margin-top:10px">Open my queue</button>
  </section>

  <section id="desk" hidden>
    <div class="bar">
      <input id="q" placeholder="Search by name, email or number" autocomplete="off" aria-label="Search applications">
      <select id="view" aria-label="Department"></select>
    </div>
    <div id="list"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LABEL = { received: "Received", in_review: "In review", needs_info: "Needs info", approved: "Approved", denied: "Denied" };
let me = null; try { me = JSON.parse(sessionStorage.getItem("sm_staff") || "null"); } catch {}
let depts = [], apps = [], openId = null;

const api = async (path, opts = {}) => {
  const r = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", "x-staff-code": me?.code ?? "", ...(opts.headers || {}) } });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { signout(); throw new Error(j.error || "Sign in again."); }
  if (!r.ok) throw new Error(j.error || `Request failed (${r.status})`);
  return j;
};

// Department list comes from the server once the code is typed; a static subset shows before that.
// Shape: [{ county, cities: [{ city, isCounty, departments: [...] }] }] → <optgroup> per county, one option per department.
const FALLBACK = [{ county: "Los Angeles County", cities: [{ city: "Santa Monica", departments: ["Planning Division", "Building & Safety, Permit Services Center", "Transportation Planning (Mobility Division)", "Public Works, Resource Recovery & Recycling", "Finance, Business License Office", "Santa Monica 311"] }] }];
const deptOptions = (groups, selected, skip = null) => groups.map((g) => `<optgroup label="${esc(g.county)}">` + g.cities.flatMap((c) => c.departments.filter((d) => d !== skip).map((d) => {
  const label = d === `City of ${c.city}` ? c.city : c.isCounty && /^County of /.test(d) ? `${c.city} (county government)` : `${c.city} · ${d}`;
  return `<option value="${esc(d)}"${d === selected ? " selected" : ""}>${esc(label)}</option>`;
})).join("") + `</optgroup>`).join("");
async function fillDeptSelect() {
  const r = await fetch("/api/staff/departments", { headers: { "x-staff-code": $("code").value } }).catch(() => null);
  const groups = r?.ok ? await r.json() : FALLBACK;
  $("dept").innerHTML = deptOptions(groups, $("dept").value || "Planning Division");
}

function signout() { me = null; sessionStorage.removeItem("sm_staff"); $("desk").hidden = true; $("who").hidden = true; $("login").hidden = false; }
async function signin(session) {
  me = session;
  try { depts = await api("/api/staff/departments"); }
  catch (e) { me = null; $("loginErr").textContent = e.message; return; }
  sessionStorage.setItem("sm_staff", JSON.stringify(me));
  $("login").hidden = true; $("desk").hidden = false; $("who").hidden = false;
  $("whoDept").innerHTML = `<b>${esc(me.name || "Staff")}</b><br><span>${esc(me.dept)}</span>`;
  $("view").innerHTML = `<option value="${esc(me.dept)}">${esc(me.dept)}</option><option value="all">All departments</option>` + deptOptions(depts, null, me.dept);
  load();
}

async function load() {
  if (!me) return;
  const dept = $("view").value || me.dept, q = $("q").value.trim();
  try { apps = await api(`/api/staff/applications?department=${encodeURIComponent(dept)}&q=${encodeURIComponent(q)}`); }
  catch (e) { $("list").innerHTML = `<p class="error">${esc(e.message)}</p>`; return; }
  render();
}
function render() {
  const dept = $("view").value, q = $("q").value.trim();
  if (!apps.length) { $("list").innerHTML = `<p class="empty">No applications${q ? ` matching “${esc(q)}”` : ""}${dept === "all" ? "" : ` for ${esc(dept)}`}.</p>`; return; }
  $("list").innerHTML = apps.map((a) => `
    <article class="app${a.confirmation_number === openId ? " open" : ""}" data-id="${esc(a.confirmation_number)}">
      <div class="top"><span class="id">${esc(a.confirmation_number)}</span><span class="name">${esc(a.applicant_name)}</span><span class="st ${esc(a.status)}">${esc(LABEL[a.status] || a.status)}</span>
        <span class="meta">${a.jurisdiction ? `${esc(a.jurisdiction)} · ` : ""}${esc(a.summary)} · ${new Date(a.submitted_at).toLocaleString()}${dept === "all" ? ` · ${esc(a.department)}` : ""}</span></div>
      <div class="detail">
        <dl>
          <dt>Type</dt><dd>${esc(a.type)}</dd>
          <dt>Applicant</dt><dd>${esc(a.applicant_name)} · ${esc(a.email)} · ${esc(a.phone)}</dd>
          ${a.address ? `<dt>Address</dt><dd>${esc(a.address)}</dd>` : ""}
          ${a.requested_date ? `<dt>Requested date</dt><dd>${esc(a.requested_date)}</dd>` : ""}
          <dt>Details</dt><dd>${esc(a.details || "—")}</dd>
          <dt>Routed to</dt><dd>${esc(a.department)}</dd>
          ${a.reviewed_by ? `<dt>Last reviewed by</dt><dd>${esc(a.reviewed_by)} · ${new Date(a.updated_at).toLocaleString()}</dd>` : ""}
        </dl>
        <label for="note-${esc(a.confirmation_number)}">Note to applicant</label>
        <textarea id="note-${esc(a.confirmation_number)}" placeholder="e.g. Please upload the signed neighbor petition.">${esc(a.staff_note || "")}</textarea>
        <div class="acts">
          <button type="button" class="ghost" data-s="in_review">Start review</button>
          <button type="button" class="ghost" data-s="needs_info">Needs info</button>
          <button type="button" class="ghost" data-s="approved">Approve</button>
          <button type="button" class="ghost" data-s="denied">Deny</button>
          <button type="button" class="ghost" data-s="">Save note only</button>
        </div>
        <div class="error"></div>
      </div>
    </article>`).join("");
}

$("list").onclick = async (e) => {
  const card = e.target.closest(".app"); if (!card) return;
  const btn = e.target.closest("button[data-s]");
  if (!btn) { if (e.target.closest(".detail")) return; openId = card.classList.contains("open") ? null : card.dataset.id; render(); return; }
  const id = card.dataset.id, note = card.querySelector("textarea").value;
  btn.disabled = true;
  try {
    const upd = await api(`/api/staff/applications/${encodeURIComponent(id)}`, { method: "PATCH", body: JSON.stringify({ status: btn.dataset.s || undefined, note, reviewer: me.name ? `${me.name} (${me.dept})` : me.dept }) });
    apps = apps.map((a) => a.confirmation_number === id ? upd : a); render();
  } catch (err) { card.querySelector(".error").textContent = err.message; btn.disabled = false; }
};
$("signin").onclick = () => signin({ dept: $("dept").value, name: $("name").value.trim(), code: $("code").value });
$("code").onkeydown = (e) => { if (e.key === "Enter") $("signin").click(); };
$("code").onchange = fillDeptSelect;
$("signout").onclick = signout;
$("view").onchange = load;
let t; $("q").oninput = () => { clearTimeout(t); t = setTimeout(load, 250); };
setInterval(() => { if (me && document.visibilityState === "visible") load(); }, 20000); // ponytail: polling; SSE if the queue gets busy

fillDeptSelect();
if (me) signin(me);
</script>
</body>
</html>
