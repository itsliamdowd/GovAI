<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<title>SantaMonica.gov</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0b0e13; --ink:#e8eaed; --muted:#9aa0a6; --line:#2a2f37; --pill:#1b1f26; --pill-2:#232830;
    --blue:#2b6fe6; --blue-2:#3b82f6; --link:#7cb0ff; --ok:#86efac; --ok-bg:#0f2a1c; --ok-line:#1f5a38; --err:#fca5a5;
    --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  }
  * { box-sizing:border-box } html { -webkit-text-size-adjust:100% }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.6 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; min-height:100dvh }
  button { font-family:inherit }
  header { position:sticky; top:0; z-index:5; background:linear-gradient(var(--bg) 70%, transparent); padding:calc(18px + var(--sat)) 28px 18px; display:flex; align-items:center; justify-content:space-between }
  .brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink) }
  .brand .flag { width:30px; height:20px; flex:none; background:linear-gradient(#b22234 0 50%,#fff 50% 100%) 0 0/100% 6px repeat-y,#fff; position:relative; border-radius:1px }
  .brand .flag::before { content:""; position:absolute; left:0; top:0; width:13px; height:10px; background:#3c3b6e }
  .brand b { font:600 26px/1 Georgia,"Times New Roman",serif; letter-spacing:-.01em }
  .menu { background:var(--blue); color:#fff; border:0; border-radius:999px; padding:14px 26px; font-size:17px; font-weight:500; cursor:pointer }
  .menu:hover { background:var(--blue-2) }
  main { max-width:1000px; margin:0 auto; padding:24px 20px calc(160px + var(--sab)) }
  .msg { margin:28px 0; animation:pop .18s ease-out } @keyframes pop { from { opacity:0; transform:translateY(6px) } }
  .me { background:var(--pill); border-radius:32px; padding:16px 26px; max-width:75%; margin-left:auto; width:fit-content; white-space:pre-wrap; word-wrap:break-word }
  .bot { max-width:100% } .bot > :first-child { margin-top:0 } .bot > :last-child { margin-bottom:0 }
  .bot p { margin:.9em 0 } .bot ul,.bot ol { margin:.7em 0; padding-left:1.5em } .bot ul { list-style:square } .bot li { margin:.3em 0 }
  .bot a { color:var(--link); text-decoration:underline; text-underline-offset:3px } .bot a::after { content:" ↗"; text-decoration:none; display:inline-block; font-size:.9em }
  .bot h1,.bot h2,.bot h3 { font-size:1.05em; font-weight:600; margin:1.3em 0 .4em }
  .bot code { background:var(--pill); padding:1px 6px; border-radius:6px; font-size:.9em } .bot strong { font-weight:600 }
  .tblwrap { overflow-x:auto; margin:.6em 0; -webkit-overflow-scrolling:touch }
  .bot table { border-collapse:collapse; font-size:15px; min-width:100% } .bot th,.bot td { border-bottom:1px solid var(--line); padding:8px 10px; text-align:left; white-space:nowrap } .bot th { color:var(--muted); font-weight:500; font-size:13px; text-transform:uppercase; letter-spacing:.04em }
  .status { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:15px; margin:16px 0 }
  .dots { display:inline-flex; gap:4px } .dots i { width:6px; height:6px; border-radius:50%; background:var(--muted); animation:b 1s infinite } .dots i:nth-child(2){animation-delay:.15s} .dots i:nth-child(3){animation-delay:.3s}
  @keyframes b { 0%,80%,100% { opacity:.25 } 40% { opacity:1 } }
  /* action row under a reply: Sources pill, thumbs, copy */
  .acts { display:flex; gap:10px; margin:18px 0 0; flex-wrap:wrap }
  .pill { display:inline-flex; align-items:center; gap:8px; background:var(--pill); border:1px solid transparent; border-radius:999px; padding:0 18px; height:58px; color:var(--ink); font-size:16px; cursor:pointer; transition:background .12s }
  .pill:hover { background:var(--pill-2) } .pill.icons { padding:0 6px; gap:0 } .pill.icons button { background:none; border:0; color:var(--ink); width:46px; height:46px; border-radius:50%; cursor:pointer; display:grid; place-items:center } .pill.icons button:hover,.pill.icons button.on { background:var(--pill-2) }
  .pill svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round }
  .pill.src { border-color:#fff; padding:0 18px 0 10px } .pill.src .stack { display:flex } .pill.src .stack img { width:32px; height:32px; border-radius:50%; border:2px solid var(--pill); background:#fff; object-fit:cover; margin-right:-10px } .pill.src .stack img:last-child { margin-right:0 }
  .chips { display:flex; flex-direction:column; align-items:flex-start; gap:12px; margin:24px 0 }
  .chip { background:transparent; border:1px solid var(--line); color:var(--ink); border-radius:999px; padding:0 30px; height:72px; font-size:19px; cursor:pointer; text-align:left; transition:background .12s } .chip:hover { background:var(--pill) }
  .card { border:1px solid var(--ok-line); background:var(--ok-bg); color:var(--ok); border-radius:20px; padding:16px 20px; margin:16px 0; max-width:560px }
  .card .num { font-size:24px; font-weight:600; letter-spacing:1px; display:flex; align-items:center; gap:10px; margin:4px 0 }
  .card button { background:transparent; border:1px solid var(--ok-line); color:inherit; border-radius:8px; padding:3px 9px; font:inherit; font-size:12px; cursor:pointer }
  .card small { display:block; opacity:.9; font-size:14px }
  .error { color:var(--err); font-size:15px }
  /* composer */
  form { position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(14px + var(--sab)); background:linear-gradient(transparent, var(--bg) 35%); z-index:5 }
  .row { max-width:1000px; margin:0 auto; display:flex; gap:6px; align-items:flex-end; background:var(--bg); border:1px solid var(--line); border-radius:40px; padding:12px 12px 12px 30px }
  .row:focus-within { border-color:#3a414b }
  textarea { flex:1; resize:none; border:0; background:transparent; color:var(--ink); font:inherit; font-size:19px; padding:14px 0; max-height:180px; outline:none; line-height:1.4 } textarea::placeholder { color:#8a9099 }
  .ib { width:54px; height:54px; border-radius:50%; border:0; display:grid; place-items:center; cursor:pointer; flex:none; background:transparent; color:var(--ink) }
  .ib svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round }
  #send { background:var(--blue); color:#fff } #send:disabled { background:var(--pill); color:#6b7280 } #send.stop svg { width:16px; height:16px; fill:#fff; stroke:none }
  .fine { max-width:1000px; margin:8px auto 0; color:var(--muted); font-size:12px; text-align:center }
  #down { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(126px + var(--sab)); width:56px; height:56px; border-radius:50%; border:1px solid var(--line); background:var(--pill); color:var(--ink); display:none; place-items:center; cursor:pointer; z-index:6 } #down.show { display:grid } #down svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round }
  /* sheets */
  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; z-index:10; align-items:flex-end; justify-content:center }
  .sheet.open { display:flex } .panel { background:#12161c; color:var(--ink); width:100%; max-width:600px; border-radius:24px 24px 0 0; padding:22px 22px calc(24px + var(--sab)); max-height:82dvh; overflow:auto; animation:up .22s ease-out; border:1px solid var(--line) }
  @media (min-width:640px) { .sheet { align-items:center } .panel { border-radius:24px } }
  @keyframes up { from { transform:translateY(30px); opacity:0 } }
  .panel h2 { margin:0 0 14px; font-size:20px; font-weight:600 }
  .panel .app { border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin:8px 0; font-size:15px } .panel .app b { font-family:ui-monospace,monospace } .panel .app .st { float:right; font-size:11px; text-transform:uppercase; color:var(--ok); background:var(--ok-bg); padding:2px 8px; border-radius:999px }
  .panel .empty { color:var(--muted); font-size:15px }
  .panel .close { margin-top:14px; width:100%; padding:14px; border:0; border-radius:999px; background:var(--blue); color:#fff; font:inherit; font-weight:500; cursor:pointer }
  .srcitem { display:flex; gap:14px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); text-decoration:none; color:inherit } .srcitem:last-of-type { border:0 }
  .srcitem img { width:44px; height:44px; border-radius:50%; background:#fff; object-fit:cover; flex:none; border:1px solid var(--line) }
  .srcitem b { display:block; font-weight:600; font-size:15px } .srcitem span { display:block; color:var(--muted); font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap } .srcitem i { margin-left:auto; color:var(--muted); font-style:normal }
  /* voice mode */
  .voice { position:fixed; inset:0; z-index:20; background:var(--bg); color:var(--ink); display:none; flex-direction:column; align-items:center; justify-content:center; gap:26px; padding:24px }
  .voice.open { display:flex }
  .orb { width:min(52vw,220px); aspect-ratio:1; border-radius:50%; background:radial-gradient(circle at 38% 35%, #fff 0%, #d7ecff 30%, #56c1e8 62%, #0b5fb3 100%); box-shadow:0 0 50px 8px rgba(86,193,232,.45), 0 0 140px 40px rgba(59,143,240,.22); transition:transform .07s linear; animation:breathe 3.2s ease-in-out infinite }
  @keyframes breathe { 50% { box-shadow:0 0 70px 14px rgba(86,193,232,.55), 0 0 160px 50px rgba(59,143,240,.28) } }
  .voice[data-state="thinking"] .orb { background:conic-gradient(from 0deg, #fff, #56c1e8, #0b5fb3, #d7ecff, #fff); filter:blur(14px); animation:spin 1.1s linear infinite; transform:scale(.8) }
  @keyframes spin { to { rotate:360deg } }
  .voice[data-state="speaking"] .orb { animation:talk .55s ease-in-out infinite alternate }
  @keyframes talk { from { transform:scale(.92) } to { transform:scale(1.12); box-shadow:0 0 80px 18px rgba(86,193,232,.6), 0 0 180px 60px rgba(59,143,240,.3) } }
  .voice.muted .orb { filter:grayscale(1); opacity:.55; animation:none }
  .vstate { font-size:15px; color:var(--muted); min-height:1.4em }
  .vtext { max-width:600px; text-align:center; font-size:17px; line-height:1.45; max-height:28vh; overflow:auto; min-height:1.5em }
  .vbtns { position:absolute; bottom:calc(44px + var(--sab)); display:flex; gap:30px }
  .vbtn { width:66px; height:66px; border-radius:50%; border:0; background:var(--pill); color:var(--ink); font-size:26px; display:grid; place-items:center; cursor:pointer }
  .vbtn:active { transform:scale(.94) } .vbtn.end { background:#dc2626; color:#fff }
  @media (max-width:640px) { header { padding-left:16px; padding-right:16px } .brand b { font-size:22px } .menu { padding:11px 20px; font-size:15px } body { font-size:16px } .me { max-width:85% } .chip { height:60px; font-size:16px; padding:0 22px } .pill { height:50px } .row { padding-left:22px } textarea { font-size:17px } }
</style>
</head>
<body>
<header>
  <a class="brand" href="/"><span class="flag" aria-hidden="true"></span><b>SantaMonica.gov</b></a>
  <button class="menu" id="appsBtn" aria-label="Menu"><span id="appsCount">Menu</span></button>
</header>

<main id="log">
  <div class="msg bot"><p>Hello. I am the City of Santa Monica's assistant, an official city service for information, permits and 311 requests.</p><p>How can I help you today?</p></div>
  <div class="chips" id="hero">
    <button class="chip" data-q="I want to host a block party on my street. What permit do I need and can you help me apply?">How do I get a permit for a block party?</button>
    <button class="chip" data-q="Help me apply for a residential preferential parking permit.">Apply for a residential parking permit</button>
    <button class="chip" data-q="Schedule a bulky item pickup for an old couch and a mattress.">Schedule a bulky item pickup</button>
    <button class="chip" data-q="How do I start a business in Santa Monica? What licenses and fees apply?">How do I start a business in Santa Monica?</button>
    <button class="chip" data-q="There's a pothole on my street. Can you report it for me?">Report a pothole on my street</button>
  </div>
</main>

<button id="down" aria-label="Scroll to bottom"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg></button>

<form id="f">
  <div class="row">
    <textarea id="in" rows="1" placeholder="Ask anything..." autocomplete="off" required></textarea>
    <button type="button" class="ib" id="mic" aria-label="Voice chat" title="Voice chat"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg></button>
    <button type="submit" class="ib" id="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>
  <div class="fine">Not for emergencies. Call 911. Non-emergency: 311 or (310) 458-8411.</div>
</form>

<div class="sheet" id="sheet" role="dialog" aria-label="Menu">
  <div class="panel">
    <h2>My applications</h2>
    <div id="appsList"></div>
    <button class="close" id="closeSheet">Close</button>
  </div>
</div>
<div class="sheet" id="srcSheet" role="dialog" aria-label="Sources">
  <div class="panel">
    <h2>Sources</h2>
    <div id="srcList"></div>
    <button class="close" id="closeSrc">Close</button>
  </div>
</div>

<div class="voice" id="voice" data-state="listening" role="dialog" aria-label="Voice chat">
  <div class="orb" id="orb"></div>
  <div class="vstate" id="vstate"></div>
  <div class="vtext" id="vtext"></div>
  <div class="vbtns">
    <button type="button" class="vbtn" id="vmute" aria-label="Mute">🎙️</button>
    <button type="button" class="vbtn end" id="vend" aria-label="End voice chat">✕</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.4/purify.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), input = $("in"), form = $("f"), sendBtn = $("send"), mic = $("mic");
const sessionId = crypto.randomUUID();
const md = (t) => DOMPurify.sanitize(marked.parse(t, { breaks: true }), { ADD_ATTR: ["target"] }).replace(/<table>/g, '<div class="tblwrap"><table>').replace(/<\/table>/g, "</table></div>");
const ICONS = {
  up: '<svg viewBox="0 0 24 24"><path d="M7 11v10H3V11zM7 11l4-8a2.5 2.5 0 0 1 2.5 2.5V9H19a2 2 0 0 1 2 2.3l-1.2 7A2 2 0 0 1 17.8 20H7"/></svg>',
  down: '<svg viewBox="0 0 24 24"><path d="M17 13V3h4v10zM17 13l-4 8a2.5 2.5 0 0 1-2.5-2.5V15H5a2 2 0 0 1-2-2.3l1.2-7A2 2 0 0 1 6.2 4H17"/></svg>',
  copy: '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></svg>',
  send: '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  stop: '<svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3"/></svg>',
};

// Official department badges: each source is mapped to the city department that published it and that department's own icon.
const CITY_ICON = "https://www.santamonica.gov/SantaMonica.Gov.Theme/Icons/favicon/apple-icon-180x180.png";
const fav = (d) => `https://www.google.com/s2/favicons?sz=128&domain=${d}`;
const DEPTS = [
  [/youtube\.com/i, "City Council · meeting video", fav("youtube.com")],
  [/city council|agenda|minutes/i, "City Council"],
  [/data\.santamonica\.gov/i, (s) => s.org ? `Open Data · ${s.org}` : "Open Data Portal", fav("data.santamonica.gov")],
  [/bigbluebus|big blue bus/i, "Big Blue Bus", fav("bigbluebus.com")],
  [/filmsantamonica|\bfilm\b/i, "Film Santa Monica", fav("filmsantamonica.com")],
  [/rent-control|lawful-rent|rent control/i, "Rent Control Board"],
  [/smpl\.org|library/i, "Santa Monica Public Library"],
  [/police|santamonicapd|alarm|animal/i, "Santa Monica Police Department"],
  [/\/fire\b|fire department/i, "Santa Monica Fire Department"],
  [/\b311\b|\/contact/i, "Santa Monica 311"],
  [/housing/i, "Housing & Human Services"],
  [/park|recreation|beach|pier|event/i, "Recreation & Arts"],
  [/tax|business-license|business license|solid-waste-rates|parking/i, "Finance Department"],
  [/permit|building|adu|planning|zoning|process-explainers/i, "Community Development · Permit Services"],
  [/sustainab|water|recycl|trash|waste|street|noise|code/i, "Public Works"],
  [/transit|transport/i, "Transportation"],
  [/clerk|election/i, "City Clerk"],
];
function deptOf(s) {
  const hay = `${s.url} ${s.title}`;
  for (const [re, name, icon] of DEPTS) if (re.test(hay)) return { name: typeof name === "function" ? name(s) : name, icon: icon ?? CITY_ICON };
  return { name: "City of Santa Monica", icon: CITY_ICON };
}
const badge = (icon, cls = "") => `<img class="${cls}" src="${esc(icon)}" alt="" onerror="this.onerror=null;this.src='/icon.svg'">`;
function sourcesPill(list) {
  const depts = [...new Map(list.map((s) => { const d = deptOf(s); return [d.name, d]; })).values()];
  const b = document.createElement("button"); b.type = "button"; b.className = "pill src";
  b.innerHTML = `<span class="stack">${depts.slice(0, 3).map((d) => badge(d.icon)).join("")}</span>Sources`;
  b.onclick = () => {
    $("srcList").innerHTML = list.map((s) => { const d = deptOf(s); return `<a class="srcitem" href="${esc(s.url)}" target="_blank" rel="noopener">${badge(d.icon)}<div style="min-width:0"><b>${esc(d.name)}</b><span>${esc(s.title)}</span></div><i>↗</i></a>`; }).join("");
    $("srcSheet").classList.add("open");
  };
  return b;
}
function actionRow(bot, sources) {
  const row = document.createElement("div"); row.className = "acts";
  if (sources.length) row.appendChild(sourcesPill(sources));
  const fb = document.createElement("div"); fb.className = "pill icons";
  fb.innerHTML = `<button type="button" aria-label="Good response">${ICONS.up}</button><button type="button" aria-label="Bad response">${ICONS.down}</button>`;
  for (const btn of fb.querySelectorAll("button")) btn.onclick = () => { for (const o of fb.querySelectorAll("button")) o.classList.toggle("on", o === btn && !o.classList.contains("on")); }; // ponytail: visual only, no feedback endpoint
  const cp = document.createElement("div"); cp.className = "pill icons"; cp.innerHTML = `<button type="button" aria-label="Copy">${ICONS.copy}</button>`;
  cp.firstChild.onclick = () => navigator.clipboard?.writeText(bot.innerText);
  row.append(fb, cp);
  return row;
}

let apps = []; try { apps = JSON.parse(localStorage.getItem("sm_apps") || "[]"); } catch {}
const renderApps = () => {
  $("appsCount").textContent = apps.length ? `Menu · ${apps.length}` : "Menu";
  $("appsList").innerHTML = apps.length ? apps.map((a) => `<div class="app"><span class="st">${esc(a.status)}</span><b>${esc(a.confirmation_number)}</b><br>${esc(a.summary)}<br><small style="color:var(--muted)">${esc(a.department)} · ${new Date(a.submitted_at).toLocaleDateString()}</small></div>`).join("") : `<p class="empty">Nothing filed yet. Ask me to apply for a permit or report an issue and it will show up here.</p>`;
};
renderApps();
$("appsBtn").onclick = () => $("sheet").classList.add("open");
$("closeSheet").onclick = () => $("sheet").classList.remove("open");
$("closeSrc").onclick = () => $("srcSheet").classList.remove("open");
for (const id of ["sheet", "srcSheet"]) $(id).onclick = (e) => { if (e.target === $(id)) $(id).classList.remove("open"); };

$("hero").onclick = (e) => { const t = e.target.closest(".chip"); if (t) { input.value = t.dataset.q; form.requestSubmit(); } };
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !/Mobi|Android/i.test(navigator.userAgent)) { e.preventDefault(); form.requestSubmit(); } });
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 180) + "px"; });
const atBottom = () => window.innerHeight + window.scrollY >= document.body.scrollHeight - 80;
window.addEventListener("scroll", () => $("down").classList.toggle("show", !atBottom()), { passive: true });
$("down").onclick = scroll;

// Voice mode: full-screen hands-free conversation (native SpeechRecognition + speechSynthesis).
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) mic.style.display = "none";
else {
  const voice = $("voice"), orb = $("orb"), vstate = $("vstate"), vtext = $("vtext"), vmute = $("vmute");
  const rec = new SR(); rec.lang = "en-US"; rec.interimResults = true;
  let active = false, muted = false;
  const setState = (s, label) => { voice.dataset.state = s; vstate.textContent = label; };
  const listen = () => { if (!active) return; vtext.textContent = ""; if (muted) return setState("listening", "Muted"); setState("listening", "Listening…"); try { rec.start(); } catch {} };
  rec.onresult = (e) => { vtext.textContent = [...e.results].map((r) => r[0].transcript).join(""); };
  rec.onerror = (e) => { if (e.error === "not-allowed") { vstate.textContent = "Microphone access denied"; active = false; } };
  rec.onend = async () => {
    if (!active || muted) return;
    const text = vtext.textContent.trim(); if (!text) return listen();
    setState("thinking", "Thinking…");
    const reply = (await send(text)).innerText.trim();
    if (!active) return;
    if (!reply) return listen();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(reply); u.lang = "en-US"; u.rate = 1.05;
    u.onend = u.onerror = () => listen();
    setState("speaking", ""); vtext.textContent = reply;
    speechSynthesis.speak(u);
  };
  // Orb swells with mic level while listening.
  async function meter() {
    let stream, ac; try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); ac = new AudioContext(); } catch { return; }
    const an = ac.createAnalyser(); an.fftSize = 256; ac.createMediaStreamSource(stream).connect(an); const buf = new Uint8Array(an.fftSize);
    (function tick() {
      if (!active) { stream.getTracks().forEach((t) => t.stop()); ac.close(); orb.style.transform = ""; return; }
      if (voice.dataset.state === "listening" && !muted) { an.getByteTimeDomainData(buf); let s = 0; for (const v of buf) { const d = (v - 128) / 128; s += d * d; } orb.style.transform = `scale(${1 + Math.min(Math.sqrt(s / buf.length) * 3, .5)})`; }
      else orb.style.transform = "";
      requestAnimationFrame(tick);
    })();
  }
  mic.onclick = () => { active = true; muted = false; voice.classList.add("open"); voice.classList.remove("muted"); vmute.textContent = "🎙️"; meter(); listen(); };
  $("vend").onclick = () => { active = false; rec.abort(); speechSynthesis.cancel(); voice.classList.remove("open"); };
  vmute.onclick = () => {
    muted = !muted; vmute.textContent = muted ? "🔇" : "🎙️"; voice.classList.toggle("muted", muted);
    if (muted) rec.abort();
    if (voice.dataset.state === "listening") listen();
  };
}

let ctrl = null; // in-flight request; the send button becomes Stop while streaming
form.onsubmit = (e) => {
  e.preventDefault();
  if (ctrl) return ctrl.abort();
  const text = input.value.trim(); if (!text) return;
  input.value = ""; input.style.height = "auto";
  send(text);
};
// Sends one user message, streams the reply into the log, resolves with the bot element.
async function send(text) {
  $("hero")?.remove();
  add("me").textContent = text;
  ctrl = new AbortController(); sendBtn.classList.add("stop"); sendBtn.innerHTML = ICONS.stop; sendBtn.setAttribute("aria-label", "Stop");

  const bot = add("bot"); let buf = "";
  const status = document.createElement("div"); status.className = "status"; status.innerHTML = `<span class="dots"><i></i><i></i><i></i></span><span>Thinking…</span>`; log.appendChild(status); scroll();
  const sources = new Map();
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sessionId, message: text }), signal: ctrl.signal });
    const reader = res.body.getReader(), dec = new TextDecoder(); let carry = "";
    while (true) {
      const { value, done } = await reader.read(); if (done) break;
      carry += dec.decode(value, { stream: true });
      const parts = carry.split("\n\n"); carry = parts.pop();
      for (const p of parts) {
        if (!p.startsWith("data: ")) continue;
        const ev = JSON.parse(p.slice(6));
        if (ev.type === "text") { buf += ev.text; bot.innerHTML = md(buf); status.remove(); }
        else if (ev.type === "status") { status.lastChild.textContent = ev.text; log.appendChild(status); }
        else if (ev.type === "sources") { for (const s of ev.data) if (s.url && !sources.has(s.url)) sources.set(s.url, s); }
        else if (ev.type === "application") { apps.unshift(ev.data); try { localStorage.setItem("sm_apps", JSON.stringify(apps)); } catch {} renderApps(); appCard(ev.data); }
        else if (ev.type === "error") { const d = document.createElement("div"); d.className = "error"; d.textContent = ev.text; bot.appendChild(d); }
        scroll();
      }
    }
  } catch (err) { if (err.name !== "AbortError") { const d = document.createElement("div"); d.className = "error"; d.textContent = "Connection lost. Try again."; bot.appendChild(d); } }
  status.remove(); if (!bot.textContent) bot.remove();
  for (const a of bot.querySelectorAll("a")) { a.target = "_blank"; a.rel = "noopener"; }
  if (bot.isConnected) bot.appendChild(actionRow(bot, [...sources.values()]));
  ctrl = null; sendBtn.classList.remove("stop"); sendBtn.innerHTML = ICONS.send; sendBtn.setAttribute("aria-label", "Send");
  if (!/Mobi|Android/i.test(navigator.userAgent) && !$("voice").classList.contains("open")) input.focus(); scroll();
  return bot;
}
function appCard(a) {
  const c = document.createElement("div"); c.className = "card";
  c.innerHTML = `<small>✅ Application received</small><div class="num">${esc(a.confirmation_number)} <button type="button">Copy</button></div><small><b>Routed to:</b> ${esc(a.department)}</small><small>${esc(a.next_steps)}</small>`;
  c.querySelector("button").onclick = (e) => { navigator.clipboard?.writeText(a.confirmation_number); e.target.textContent = "Copied"; };
  log.appendChild(c);
}
function add(cls) { const d = document.createElement("div"); d.className = "msg " + cls; log.appendChild(d); scroll(); return d; }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function scroll() { requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight })); }
</script>
