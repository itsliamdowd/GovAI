<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Ask Santa Monica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0b0e13; --ink:#e8eaed; --muted:#9aa0a6; --line:#2a2f37; --pill:#1b1f26; --pill-2:#232830;
    --blue:#2b6fe6; --blue-2:#3b82f6; --link:#7cb0ff; --ok:#86efac; --ok-bg:#0f2a1c; --ok-line:#1f5a38; --err:#fca5a5;
    --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  }
  * { box-sizing:border-box } html { -webkit-text-size-adjust:100% }
  /* Scale: type 12/13/14/16/20 · space 4/8/12/16/24/32 · radius 10/14/999 · one accent (blue), one reading column (720px) */
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; min-height:100dvh; -webkit-font-smoothing:antialiased }
  button { font-family:inherit }
  header { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); padding:calc(10px + var(--sat)) 20px 10px }
  .hrow { max-width:720px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px }
  .brand { display:flex; align-items:center; gap:9px; text-decoration:none; color:var(--ink) }
  .brand .flag { width:18px; height:12px; flex:none; background:linear-gradient(#b22234 0 50%,#fff 50% 100%) 0 0/100% 3.4px repeat-y,#fff; position:relative; border-radius:1px; opacity:.9 }
  .brand .flag::before { content:""; position:absolute; left:0; top:0; width:8px; height:6px; background:#3c3b6e }
  .brand b { font:600 17px/1 Georgia,"Times New Roman",serif; letter-spacing:-.01em } .brand small { color:var(--muted); font-size:12px; margin-left:4px; padding-left:10px; border-left:1px solid var(--line) }
  .menu { background:transparent; color:var(--ink); border:1px solid var(--line); border-radius:999px; height:34px; padding:0 14px; font-size:13px; font-weight:500; cursor:pointer; transition:background .12s }
  .menu:hover { background:var(--pill) }
  main { max-width:720px; margin:0 auto; padding:32px 20px calc(140px + var(--sab)) }
  .msg { margin:24px 0; animation:pop .18s ease-out } @keyframes pop { from { opacity:0; transform:translateY(4px) } }
  .me { background:var(--pill); border-radius:18px 18px 4px 18px; padding:10px 16px; max-width:72%; margin-left:auto; width:fit-content; white-space:pre-wrap; word-wrap:break-word; font-size:15.5px }
  .bot { max-width:100% } .bot > :first-child { margin-top:0 } .bot > :last-child { margin-bottom:0 }
  .bot p { margin:.75em 0 } .bot ul,.bot ol { margin:.6em 0; padding-left:1.4em } .bot li { margin:.25em 0 } .bot li::marker { color:var(--muted) }
  .bot a { color:var(--link); text-decoration:underline; text-decoration-color:color-mix(in srgb, var(--link) 40%, transparent); text-underline-offset:3px } .bot a:hover { text-decoration-color:var(--link) }
  .bot h1,.bot h2,.bot h3 { font-size:1em; font-weight:600; margin:1.2em 0 .35em; letter-spacing:-.005em }
  .bot code { background:var(--pill); padding:1px 6px; border-radius:6px; font-size:.88em } .bot strong { font-weight:600 }
  .tblwrap { overflow-x:auto; margin:.8em 0; -webkit-overflow-scrolling:touch; border:1px solid var(--line); border-radius:10px }
  .bot table { border-collapse:collapse; font-size:14px; width:100% } .bot th,.bot td { border-bottom:1px solid var(--line); padding:8px 12px; text-align:left; vertical-align:top } .bot th { color:var(--muted); font-weight:500; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; background:var(--pill) }
  .bot tr:last-child td { border-bottom:0 } .bot td.num,.bot th.num { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums } .bot td.num { font-weight:600 }
  .status { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13.5px; margin:12px 0 }
  .dots { display:inline-flex; gap:4px } .dots i { width:5px; height:5px; border-radius:50%; background:var(--muted); animation:b 1s infinite } .dots i:nth-child(2){animation-delay:.15s} .dots i:nth-child(3){animation-delay:.3s}
  @keyframes b { 0%,80%,100% { opacity:.25 } 40% { opacity:1 } }
  /* action row under a reply: Sources pill, thumbs, copy */
  .acts { display:flex; gap:6px; margin:14px 0 0; flex-wrap:wrap; align-items:center }
  .pill { display:inline-flex; align-items:center; gap:8px; background:transparent; border:1px solid var(--line); border-radius:999px; padding:0 12px; height:34px; color:var(--ink); font-size:13px; cursor:pointer; transition:background .12s }
  .pill:hover { background:var(--pill) } .pill.icons { padding:0 2px; gap:0; border-color:transparent } .pill.icons button { background:none; border:0; color:var(--muted); width:30px; height:30px; border-radius:50%; cursor:pointer; display:grid; place-items:center } .pill.icons button:hover,.pill.icons button.on { background:var(--pill); color:var(--ink) }
  .pill svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round }
  .pill.src { padding:0 12px 0 6px } .pill.src .stack { display:flex } .pill.src .stack img { width:22px; height:22px; border-radius:50%; border:2px solid var(--bg); background:#fff; object-fit:cover; margin-right:-7px } .pill.src .stack img:last-child { margin-right:0 }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:20px 0 }
  .chip { background:transparent; border:1px solid var(--line); color:var(--ink); border-radius:999px; padding:9px 16px; font-size:14px; line-height:1.3; cursor:pointer; text-align:left; transition:background .12s, border-color .12s } .chip:hover { background:var(--pill); border-color:#3a414b }
  .card { border:1px solid var(--ok-line); background:var(--ok-bg); color:var(--ok); border-radius:14px; padding:14px 16px; margin:12px 0; max-width:480px }
  .card .num { font-size:20px; font-weight:600; letter-spacing:.5px; display:flex; align-items:center; gap:10px; margin:2px 0 4px; font-variant-numeric:tabular-nums }
  .card button { background:transparent; border:1px solid var(--ok-line); color:inherit; border-radius:999px; padding:2px 10px; font:inherit; font-size:12px; cursor:pointer }
  .card small { display:block; opacity:.9; font-size:13px }
  /* application form card: one question per step → ✓ submitted */
  .form { border:1px solid var(--line); background:var(--pill); border-radius:14px; padding:16px 18px; margin:12px 0; max-width:480px; animation:pop .18s ease-out }
  .form h3 { margin:0 0 4px; font-size:15px; font-weight:600 } .form .sub { color:var(--muted); font-size:13px; margin:0 0 12px; line-height:1.45 } .form .sub a { color:var(--link) }
  .form .step { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em }
  .form .bar { height:3px; background:var(--line); border-radius:2px; overflow:hidden; margin:6px 0 14px } .form .bar i { display:block; height:100%; background:var(--blue); transition:width .25s }
  .form label { display:block; font-size:15px; font-weight:500; margin:0 0 6px } .form .hint { color:var(--muted); font-size:13px; margin:-2px 0 10px; line-height:1.45 }
  .form input,.form select,.form textarea { width:100%; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font:inherit; font-size:15px; outline:none } .form :is(input,select,textarea):focus { border-color:var(--blue-2) } .form textarea { min-height:84px; resize:vertical }
  .form .nav { display:flex; gap:8px; justify-content:space-between; margin-top:14px } .form .nav button { border:1px solid var(--line); border-radius:999px; height:34px; padding:0 16px; font:inherit; font-size:13px; font-weight:500; cursor:pointer; background:transparent; color:var(--ink) } .form .nav .next { background:var(--blue); border-color:var(--blue); color:#fff } .form .nav .next:hover { background:var(--blue-2) } .form .nav button:disabled { opacity:.35; cursor:default }
  .form.done { border-color:var(--ok-line); background:var(--ok-bg); color:var(--ok); text-align:center } .form.done .num { font-size:20px; font-weight:600; letter-spacing:.5px; display:flex; align-items:center; justify-content:center; gap:10px; margin:2px 0 6px; font-variant-numeric:tabular-nums } .form.done .num button { background:transparent; border:1px solid var(--ok-line); color:inherit; border-radius:999px; padding:2px 10px; font:inherit; font-size:12px; cursor:pointer } .form.done small { display:block; opacity:.9; font-size:13px }
  .form .check { width:52px; height:52px; border-radius:50%; background:var(--ok); color:var(--ok-bg); display:grid; place-items:center; font-size:28px; font-weight:700; margin:2px auto 8px; animation:pop .35s ease-out }
  .error { color:var(--err); font-size:14px }
  /* council video moment: thumbnail → player at the cited second */
  .clip { border:1px solid var(--line); border-radius:14px; margin:12px 0; max-width:480px; overflow:hidden; background:var(--pill) }
  .clip .thumb { position:relative; aspect-ratio:16/9; background:#000 center/cover no-repeat; cursor:pointer; display:grid; place-items:center }
  .clip .thumb::after { content:"▶"; width:44px; height:44px; border-radius:50%; background:rgba(0,0,0,.6); color:#fff; display:grid; place-items:center; font-size:16px; padding-left:3px; transition:background .12s }
  .clip .thumb:hover::after { background:var(--blue) }
  .clip .ts { position:absolute; left:8px; bottom:8px; background:rgba(0,0,0,.75); color:#fff; font:500 11px/1 ui-monospace,monospace; padding:4px 6px; border-radius:4px }
  .clip iframe { width:100%; aspect-ratio:16/9; border:0; display:block }
  .clip .body { padding:10px 14px 12px } .clip .body b { font-size:13px } .clip .body p { margin:4px 0 8px; font-size:13.5px; color:var(--muted); max-height:4.6em; overflow:hidden; line-height:1.5 } .clip .body p.open { max-height:none }
  .clip .cacts { display:flex; gap:6px; flex-wrap:wrap } .clip .cacts a,.clip .cacts button { font:inherit; font-size:12.5px; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:999px; padding:4px 10px; text-decoration:none; cursor:pointer } .clip .cacts a:hover,.clip .cacts button:hover { background:var(--pill-2) }
  /* composer */
  form { position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(12px + var(--sab)); background:linear-gradient(transparent, var(--bg) 40%); z-index:5 }
  .row { max-width:720px; margin:0 auto; display:flex; gap:4px; align-items:flex-end; background:var(--pill); border:1px solid var(--line); border-radius:26px; padding:6px 6px 6px 18px; transition:border-color .12s }
  .row:focus-within { border-color:#4a515b }
  textarea { flex:1; resize:none; border:0; background:transparent; color:var(--ink); font:inherit; font-size:16px; padding:10px 0; max-height:160px; outline:none; line-height:1.4 } textarea::placeholder { color:#7d848d }
  .ib { width:40px; height:40px; border-radius:50%; border:0; display:grid; place-items:center; cursor:pointer; flex:none; background:transparent; color:var(--muted) } .ib:hover { color:var(--ink) }
  .ib svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round }
  #send { background:var(--blue); color:#fff } #send:hover { background:var(--blue-2); color:#fff } #send:disabled { background:var(--pill-2); color:#6b7280 } #send.stop svg { width:14px; height:14px; fill:#fff; stroke:none }
  .fine { max-width:720px; margin:8px auto 0; color:var(--muted); font-size:11.5px; text-align:center }
  #down { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(100px + var(--sab)); width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--pill); color:var(--ink); display:none; place-items:center; cursor:pointer; z-index:6 } #down.show { display:grid } #down svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round }
  /* sheets */
  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; z-index:10; align-items:flex-end; justify-content:center }
  .sheet.open { display:flex } .panel { background:#12161c; color:var(--ink); width:100%; max-width:600px; border-radius:24px 24px 0 0; padding:22px 22px calc(24px + var(--sab)); max-height:82dvh; overflow:auto; animation:up .22s ease-out; border:1px solid var(--line) }
  @media (min-width:640px) { .sheet { align-items:center } .panel { border-radius:24px } }
  @keyframes up { from { transform:translateY(30px); opacity:0 } }
  .panel h2 { margin:0 0 12px; font-size:18px; font-weight:600; letter-spacing:-.01em }
  .panel h3 { font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:18px 0 6px; font-weight:500 }
  .panel .app { border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin:6px 0; font-size:14px } .panel .app b { font-family:ui-monospace,monospace } .panel .app .st { float:right; font-size:10.5px; text-transform:uppercase; color:var(--ok); background:var(--ok-bg); padding:2px 8px; border-radius:999px }
  .panel .mom { display:flex; gap:10px; align-items:center; border:1px solid var(--line); border-radius:12px; padding:8px 10px; margin:6px 0; font-size:13.5px; cursor:pointer } .panel .mom:hover { background:var(--pill) } .panel .mom img { width:64px; aspect-ratio:16/9; object-fit:cover; border-radius:6px; flex:none } .panel .mom small { color:var(--muted); display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .panel .empty { color:var(--muted); font-size:14px }
  .panel .close { margin-top:14px; width:100%; padding:12px; border:1px solid var(--line); border-radius:999px; background:transparent; color:var(--ink); font:inherit; font-size:14px; font-weight:500; cursor:pointer } .panel .close:hover { background:var(--pill) }
  .srcitem { display:flex; gap:14px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); text-decoration:none; color:inherit } .srcitem:last-of-type { border:0 }
  .srcitem img { width:44px; height:44px; border-radius:50%; background:#fff; object-fit:cover; flex:none; border:1px solid var(--line) }
  .srcitem b { display:block; font-weight:600; font-size:15px } .srcitem span { display:block; color:var(--muted); font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap } .srcitem i { margin-left:auto; color:var(--muted); font-style:normal }
  /* voice mode */
  .voice { position:fixed; inset:0; z-index:20; background:var(--bg); color:var(--ink); display:none; flex-direction:column; align-items:center; justify-content:center; gap:26px; padding:24px }
  .voice.open { display:flex }
  .orb { width:min(52vw,220px); aspect-ratio:1; border-radius:50%; background:radial-gradient(circle at 38% 35%, #fff 0%, #d7ecff 30%, #56c1e8 62%, #0b5fb3 100%); box-shadow:0 0 50px 8px rgba(86,193,232,.45), 0 0 140px 40px rgba(59,143,240,.22); transition:transform .07s linear; animation:breathe 3.2s ease-in-out infinite }
  @keyframes breathe { 50% { box-shadow:0 0 70px 14px rgba(86,193,232,.55), 0 0 160px 50px rgba(59,143,240,.28) } }
  .voice[data-state="thinking"] .orb { background:conic-gradient(from 0deg, #fff, #56c1e8, #0b5fb3, #d7ecff, #fff); filter:blur(14px); animation:spin 1.1s linear infinite; transform:scale(.8) }
  @keyframes spin { to { rotate:360deg } }
  .voice[data-state="speaking"] .orb { animation:talk .55s ease-in-out infinite alternate }
  @keyframes talk { from { transform:scale(.92) } to { transform:scale(1.12); box-shadow:0 0 80px 18px rgba(86,193,232,.6), 0 0 180px 60px rgba(59,143,240,.3) } }
  .voice.muted .orb { filter:grayscale(1); opacity:.55; animation:none }
  .vstate { font-size:15px; color:var(--muted); min-height:1.4em }
  .vtext { max-width:600px; text-align:center; font-size:17px; line-height:1.45; max-height:28vh; overflow:auto; min-height:1.5em }
  .vbtns { position:absolute; bottom:calc(44px + var(--sab)); display:flex; gap:30px }
  .vbtn { width:66px; height:66px; border-radius:50%; border:0; background:var(--pill); color:var(--ink); font-size:26px; display:grid; place-items:center; cursor:pointer }
  .vbtn:active { transform:scale(.94) } .vbtn.end { background:#dc2626; color:#fff }
  @media (max-width:640px) { header { padding-left:16px; padding-right:16px } .brand small { display:none } main { padding-top:20px } body { font-size:15.5px } .me { max-width:85% } .chip { font-size:13.5px; padding:8px 14px } .row { padding-left:16px } textarea { font-size:16px } .clip,.card { max-width:100% } }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <a class="brand" href="/"><span class="flag" aria-hidden="true"></span><b>Ask Santa Monica</b></a>
    <button class="menu" id="appsBtn" aria-label="Menu"><span id="appsCount">Menu</span></button>
  </div>
</header>

<main id="log">
  <div class="msg bot"><p>Hello. I am the City of Santa Monica's assistant, an official city service for information, permits and 311 requests.</p><p>How can I help you today?</p></div>
  <div class="chips" id="hero">
    <button class="chip" data-q="I want to host a block party on my street. What permit do I need and can you help me apply?">How do I get a permit for a block party?</button>
    <button class="chip" data-q="Help me apply for a residential preferential parking permit.">Apply for a residential parking permit</button>
    <button class="chip" data-q="Schedule a bulky item pickup for an old couch and a mattress.">Schedule a bulky item pickup</button>
    <button class="chip" data-q="How do I start a business in Santa Monica? What licenses and fees apply?">How do I start a business in Santa Monica?</button>
    <button class="chip" data-q="There's a pothole on my street. Can you report it for me?">Report a pothole on my street</button>
  </div>
</main>

<button id="down" aria-label="Scroll to bottom"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg></button>

<form id="f">
  <div class="row">
    <textarea id="in" rows="1" placeholder="Ask anything..." autocomplete="off" required></textarea>
    <button type="button" class="ib" id="mic" aria-label="Voice chat" title="Voice chat"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg></button>
    <button type="submit" class="ib" id="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>
  <div class="fine">Not for emergencies. Call 911. Non-emergency: 311 or (310) 458-8411.</div>
</form>

<div class="sheet" id="sheet" role="dialog" aria-label="Menu">
  <div class="panel">
    <h2>My stuff</h2>
    <h3>Applications &amp; watches</h3>
    <div id="appsList"></div>
    <h3>Saved council moments</h3>
    <div id="momList"></div>
    <button class="close" id="closeSheet">Close</button>
  </div>
</div>
<div class="sheet" id="srcSheet" role="dialog" aria-label="Sources">
  <div class="panel">
    <h2>Sources</h2>
    <div id="srcList"></div>
    <button class="close" id="closeSrc">Close</button>
  </div>
</div>

<div class="voice" id="voice" data-state="listening" role="dialog" aria-label="Voice chat">
  <div class="orb" id="orb"></div>
  <div class="vstate" id="vstate"></div>
  <div class="vtext" id="vtext"></div>
  <div class="vbtns">
    <button type="button" class="vbtn" id="vmute" aria-label="Mute">🎙️</button>
    <button type="button" class="vbtn end" id="vend" aria-label="End voice chat">✕</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.4/purify.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), input = $("in"), form = $("f"), sendBtn = $("send"), mic = $("mic");
const sessionId = crypto.randomUUID();
const NUM = /^[~≈$€£]?\s?\d[\d,.]*\s?(%|\/\s?\w+)?$/; // "$233.15", "2,500", "12%", "$251.50/hour"
function md(t) {
  const d = document.createElement("div"); d.innerHTML = DOMPurify.sanitize(marked.parse(t, { breaks: true }), { ADD_ATTR: ["target"] });
  for (const tbl of d.querySelectorAll("table")) {
    const w = document.createElement("div"); w.className = "tblwrap"; tbl.replaceWith(w); w.appendChild(tbl);
    const rows = [...tbl.rows], cols = Math.max(0, ...rows.map((r) => r.cells.length));
    for (let c = 0; c < cols; c++) { // a column is numeric when every filled body cell is a number → right-aligned, tabular figures
      const body = rows.map((r) => r.cells[c]).filter((x) => x && x.tagName === "TD" && x.textContent.trim());
      if (body.length && body.every((x) => NUM.test(x.textContent.trim()))) for (const r of rows) r.cells[c]?.classList.add("num");
    }
  }
  return d.innerHTML;
}
const ICONS = {
  up: '<svg viewBox="0 0 24 24"><path d="M7 11v10H3V11zM7 11l4-8a2.5 2.5 0 0 1 2.5 2.5V9H19a2 2 0 0 1 2 2.3l-1.2 7A2 2 0 0 1 17.8 20H7"/></svg>',
  down: '<svg viewBox="0 0 24 24"><path d="M17 13V3h4v10zM17 13l-4 8a2.5 2.5 0 0 1-2.5-2.5V15H5a2 2 0 0 1-2-2.3l1.2-7A2 2 0 0 1 6.2 4H17"/></svg>',

// Sends one user message, streams the reply into the log, resolves with the bot element.
async function send(text) {

  ctrl = new AbortController(); sendBtn.classList.add("stop"); sendBtn.innerHTML = ICONS.stop; sendBtn.setAttribute("aria-label", "Stop");

  const bot = add("bot"); let buf = "";

  // as one burst (measured: ~15 deltas within 5ms on every request shape), so queue deltas and let a frame

  let pending = "", raf = 0, thought = "";

    raf = 0; if (!pending) return;
    const n = Math.max(2, Math.ceil(pending.length / 90));
    buf += pending.slice(0, n); pending = pending.slice(n);
    bot.innerHTML = md(buf); status.remove(); if (atBottom()) scroll();
    if (pending) raf = requestAnimationFrame(drain);
  };

  let card = false;
  const cardOnly = () => { if (raf) cancelAnimationFrame(raf); raf = 0; pending = ""; buf = ""; bot.innerHTML = ""; status.remove(); card = true; };
  // The dev server (node --watch) restarts on every file save, killing in-flight requests and refusing new ones for a few
  // seconds while the index rebuilds. If nothing has streamed yet, wait for it to come back and resend once instead of failing.
  for (let attempt = 0; ; attempt++) try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sessionId, message: text }), signal: ctrl.signal });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const { value, done } = await reader.read(); if (done) break;

        else if (ev.type === "thinking") { thought = (thought + ev.text).slice(-90); status.lastChild.textContent = "Thinking… " + thought.replace(/\s+/g, " "); if (!bot.textContent) log.appendChild(status); }
        else if (ev.type === "reset") { flush(); buf = ""; bot.innerHTML = ""; thought = ""; }
        else if (ev.type === "status") { flush(); thought = ""; status.lastChild.textContent = ev.text; log.appendChild(status); }
        else if (ev.type === "sources") { for (const s of ev.data) if (s.url && !sources.has(s.url)) sources.set(s.url, s); }
        else if (ev.type === "clips") { for (const c of ev.data) clipCard(c); }
        else if (ev.type === "form") { cardOnly(); formCard(ev.data); }
        else if (ev.type === "application" || ev.type === "alert") { cardOnly(); apps.unshift(ev.data); try { localStorage.setItem("sm_apps", JSON.stringify(apps)); } catch {} renderApps(); appCard(ev.data, ev.type === "alert" ? "🔔 Daily watch on" : "✅ Application received"); }
        else if (ev.type === "error") { flush(); const d = document.createElement("div"); d.className = "error"; d.textContent = ev.text; bot.appendChild(d); }

  }

}

      c.innerHTML = `<div class="check">✓</div><h3>Application submitted</h3><div class="num">${esc(a.confirmation_number)} <button type="button">Copy</button></div><small><b>Routed to:</b> ${esc(a.department)}</small><small>${esc(a.next_steps)}</small><small style="margin-top:8px;color:var(--muted)">Track it any time under Menu, top right.</small>`;
      c.querySelector("button").onclick = (e) => { navigator.clipboard?.writeText(a.confirmation_number); e.target.textContent = "Copied"; };
    } catch (e) {
      c.innerHTML = `<h3>${esc(f.title)}</h3><div class="error">${esc(e.message)}</div><div class="nav"><span></span><button type="button" class="next">Back to form</button></div>`;
      c.querySelector(".next").onclick = () => { i = f.fields.length - 1; render(); };
    }
    scroll();
  }
  render(); scroll();
}
function add(cls) { const d = document.createElement("div"); d.className = "msg " + cls; log.appendChild(d); scroll(); return d; }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function scroll() { requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight })); }
if (location.hostname === "localhost") { const es = new EventSource("/dev"); let first = true; es.onopen = () => { if (!first) location.reload(); first = false; }; es.onmessage = () => location.reload(); }
</script>
